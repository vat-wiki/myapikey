<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='9' fill='%231f6bff'/%3E%3Cg fill='none' stroke='%23fff' stroke-width='3.2' stroke-linecap='round' stroke-linejoin='round'%3E%3Ccircle cx='14' cy='16.5' r='4.6'/%3E%3Cpath d='M19.6 16.5 H31.5 M26.5 16.5 V20.8 M31.5 16.5 V19.5'/%3E%3C/g%3E%3Cpath d='M6 28 Q9.5 25 13 28 T20 28 T27 28 T34 28' fill='none' stroke='%23fff' stroke-width='3' stroke-linecap='round' opacity='0.9'/%3E%3C/svg%3E" />
    <title>MyAPIKey</title>
    <script>
      // Apply saved theme before paint to avoid a flash of the wrong theme.
      try {
        var saved = localStorage.getItem("myapikey.theme");
        if (saved === "light") document.documentElement.classList.remove("dark");
        else document.documentElement.classList.add("dark");
      } catch (e) {
        document.documentElement.classList.add("dark");
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
