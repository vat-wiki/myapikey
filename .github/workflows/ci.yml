name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: Typecheck · Test · E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit / integration tests
        run: npm test

      # test:e2e boots a real gateway + scripted mock upstream and drives them
      # with Chrome (playwright.config.ts pins channel: "chrome").
      - name: Install Chrome for Playwright
        run: npx playwright install --with-deps chrome

      - name: E2E tests
        run: npm run test:e2e

  publish:
    name: Publish to npm
    needs: ci
    # Publish only when CI goes green on main itself — never on PRs.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm publish --provenance
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install
        run: npm ci

      # Only publish when the version in package.json isn't on npm yet — so a
      # no-op push to main keeps CI green instead of failing on a duplicate
      # version. Bump the version, push, and it ships.
      - name: Check if version is new
        id: version
        run: |
          LOCAL=$(node -p "require('./package.json').version")
          if npm view "myapikey@$LOCAL" version >/dev/null 2>&1; then
            echo "Version $LOCAL is already on npm — skipping publish."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Version $LOCAL is not on npm yet — will publish."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build web UI
        if: steps.version.outputs.changed == 'true'
        run: npm run build:web

      - name: Publish
        if: steps.version.outputs.changed == 'true'
        # --access public: provenance needs it for a first-time package
        # (npm defaults new packages to private, and provenance is public-only).
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  release:
    name: Tag & GitHub Release
    needs: publish
    # Same gate as publish: only on a real push to main (never on PRs).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      # gh release create (via GITHUB_TOKEN) needs this to make the tag + release.
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Idempotent: if a release for this version already exists (e.g. created
      # out-of-band, or a re-run of the workflow), do nothing. Independent of the
      # npm check above so a publish that shipped without a release still gets one.
      - name: Check if release exists
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists — skipping."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # gh release create makes BOTH the vX.Y.Z tag (pointing at the release
      # commit pushed to main) and the release, with auto-generated notes
      # (diffed against the previous release). So nothing to do by hand after a
      # bump+push — npm publish, the tag, and the release all happen here.
      - name: Create tag + GitHub Release
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.check.outputs.version }}" \
            --target "$GITHUB_SHA" \
            --title "${{ steps.check.outputs.version }}" \
            --generate-notes
